<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pienso En Ti" />
  <meta name="theme-color" content="#ff69b4" />
  <meta name="description" content="Pienso En Ti <3" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <title>Pienso En Ti &lt;3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
      <audio id="backgroundMusic" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<button onclick="
  const music = document.getElementById('backgroundMusic');
  if (music.paused) {
    music.play();
    this.innerText = 'Ⅱ Pausar música';
  } else {
    music.pause();
    this.innerText = '♫ Reproducir música';
  }
">
  ♫ Reproducir música
</button>

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, sans-serif;
    }
  
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(ellipse at center, #1a0a12 0%, #0a0a0a 70%);
    }

    /* Soft pink ambient */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(255, 50, 150, 0.12) 0%, transparent 55%);
      pointer-events: none;
    }

    /* ========== ENVELOPE ========== */
    .envelope-container {
      position: relative;
      width: min(340px, 82vw);
      cursor: pointer;
      z-index: 10;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.7s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    .envelope-container img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 20px 40px rgba(255, 20, 147, 0.35));
      transition: filter 0.4s ease, transform 0.4s ease;
    }

    .envelope-container:active img {
      transform: scale(0.97);
    }

    .envelope-container.opening {
      pointer-events: none;
    }

    .envelope-container.opened {
      opacity: 0;
      transform: scale(0.75) translateY(-60px);
      pointer-events: none;
    }

    /* Soft glow behind */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 120%;
      height: 120%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(255, 80, 160, 0.35) 0%, transparent 65%);
      filter: blur(30px);
      z-index: -1;
      animation: pulse 3.5s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.08); }
    }

    /* Hint */
    .hint {
      position: absolute;
      bottom: -42px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: rgba(255, 160, 200, 0.65);
      letter-spacing: 2px;
      text-transform: lowercase;
      white-space: nowrap;
      transition: opacity 0.4s;
      font-weight: 300;
    }

    .envelope-container.opening .hint,
    .envelope-container.opened .hint {
      opacity: 0;
    }

    /* ========== LETTER ========== */
    .letter-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.55);
      opacity: 0;
      width: min(94vw, 460px);
      max-height: 90vh;
      overflow-y: auto;
      overflow-x: hidden;
      border-radius: 10px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.5);
      z-index: 5;
      pointer-events: none;
      transition: opacity 0.9s ease 0.35s, transform 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s;
      background: #fff;
      -webkit-overflow-scrolling: touch;
    }

    .letter-wrapper.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }

    .letter-wrapper img {
      display: block;
      width: 100%;
      height: auto;
    }

    .letter-wrapper::-webkit-scrollbar {
      width: 5px;
    }
    .letter-wrapper::-webkit-scrollbar-track {
      background: transparent;
    }
    .letter-wrapper::-webkit-scrollbar-thumb {
      background: rgba(255, 105, 180, 0.4);
      border-radius: 3px;
    }

    /* Click area */
    .click-area {
      position: absolute;
      inset: 0;
      z-index: 20;
    }
  </style>
</head>
<body>

  <!-- Envelope -->
  <div class="envelope-container" id="envelope">
    <div class="glow"></div>
    <img src="envelope.png" alt="Sobre" draggable="false" />
    <div class="hint">tócame</div>
    <div class="click-area" id="clickArea"></div>
  </div>

  <!-- Letter -->
  <div class="letter-wrapper" id="letter">
    <img src="carta.png" alt="Carta" draggable="false" />
  </div>

  <!-- Audio -->
  <audio id="bgMusic" src="musica.mp3" loop preload="auto"></audio>
  <audio id="openSound" src="open.mp3" preload="auto"></audio>

  <script>
    const envelope = document.getElementById('envelope');
    const letter = document.getElementById('letter');
    const clickArea = document.getElementById('clickArea');
    const bgMusic = document.getElementById('bgMusic');
    const openSound = document.getElementById('openSound');

    let opened = false;

    bgMusic.volume = 0.55;
    openSound.volume = 0.65;

    function openLetter() {
      if (opened) return;
      opened = true;

      openSound.currentTime = 0;
      openSound.play().catch(() => {});

      bgMusic.play().catch(() => {});

      envelope.classList.add('opening');

      setTimeout(() => {
        envelope.classList.add('opened');
        letter.classList.add('show');
      }, 450);
    }

    clickArea.addEventListener('click', openLetter);
    clickArea.addEventListener('touchstart', (e) => {
      e.preventDefault();
      openLetter();
    }, { passive: false });

    // Block further interaction after open
    document.addEventListener('click', (e) => {
      if (opened && !letter.contains(e.target)) {
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  <audio id="backgroundMusic" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>
  </script>
</body>
</html>
